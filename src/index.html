<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#0d6efd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />

    <!-- SEO Meta Tags -->
    <title>Sitemap - duyet.net</title>
    <meta
      name="description"
      content="Comprehensive sitemap for all duyet.net domains and projects - blog, portfolio, demos, and more"
    />
    <meta name="author" content="Van-Duyet Le" />
    <meta name="keywords" content="sitemap, duyet.net, portfolio, blog, projects" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sitemap.duyet.net/" />
    <meta property="og:title" content="Sitemap - duyet.net" />
    <meta
      property="og:description"
      content="Comprehensive sitemap for all duyet.net domains and projects"
    />
    <meta property="og:image" content="https://sitemap.duyet.net/assets/img/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://sitemap.duyet.net/" />
    <meta property="twitter:title" content="Sitemap - duyet.net" />
    <meta
      property="twitter:description"
      content="Comprehensive sitemap for all duyet.net domains and projects"
    />
    <meta property="twitter:image" content="https://sitemap.duyet.net/assets/img/og-image.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="/img/icon16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/icon32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />

    <!-- Manifest for PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Styles -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/main.css" />

    <script type="module" src="/js/main.js"></script>
  </head>

  <body>
    <!-- Theme Toggle -->
    <button
      id="theme-toggle"
      class="btn btn-outline-secondary position-fixed top-0 end-0 m-3"
      style="z-index: 1000"
      aria-label="Toggle dark mode"
      title="Toggle dark mode"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        fill="currentColor"
        class="bi bi-moon-stars-fill"
        viewBox="0 0 16 16"
        id="theme-icon-dark"
      >
        <path
          d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z"
        />
        <path
          d="M10.794 3.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387a1.734 1.734 0 0 0-1.097 1.097l-.387 1.162a.217.217 0 0 1-.412 0l-.387-1.162A1.734 1.734 0 0 0 9.31 6.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387a1.734 1.734 0 0 0 1.097-1.097l.387-1.162z"
        />
      </svg>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        fill="currentColor"
        class="bi bi-sun-fill d-none"
        viewBox="0 0 16 16"
        id="theme-icon-light"
      >
        <path
          d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708z"
        />
      </svg>
    </button>

    <!-- Main Content -->
    <div class="container py-5">
      <div class="row">
        <div class="col-lg-8 mx-auto">
          <!-- Header -->
          <header class="mb-5 text-center">
            <h1 class="display-4 fw-bold mb-3">sitemap.duyet.net</h1>
            <p class="lead text-muted">
              Comprehensive directory of all duyet.net domains and projects
            </p>
          </header>

          <!-- Search Box -->
          <div class="card shadow-sm mb-5">
            <div class="card-body p-4">
              <form id="search-form" role="search" aria-label="Search sitemap">
                <div class="position-relative">
                  <input
                    type="search"
                    id="search-box"
                    class="form-control form-control-lg"
                    placeholder="Search across all sites..."
                    aria-label="Search input"
                    autocomplete="off"
                  />
                  <div
                    id="search-loading"
                    class="spinner-border spinner-border-sm position-absolute top-50 end-0 translate-middle-y me-3 d-none"
                    role="status"
                    aria-label="Loading search results"
                  >
                    <span class="visually-hidden">Loading...</span>
                  </div>
                </div>
                <div
                  id="search-results"
                  class="list-group mt-3 d-none"
                  role="region"
                  aria-live="polite"
                  aria-label="Search results"
                ></div>
                <div
                  id="search-error"
                  class="alert alert-danger mt-3 d-none"
                  role="alert"
                ></div>
              </form>
            </div>
          </div>

          <!-- Sitemap Links -->
          <div id="sitemap-container" role="main" aria-label="Sitemap links">
            <!-- Generated dynamically -->
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-5 py-4 bg-body-tertiary">
      <div class="container text-center">
        <p class="mb-0">
          &copy; <a href="https://me.duyet.net" class="text-decoration-none">Van-Duyet Le</a>
          &middot; v2.0.0 &middot;
          <a
            href="https://github.com/duyet-website/sitemap.duyet.net"
            class="text-decoration-none"
            target="_blank"
            rel="noopener noreferrer"
          >
            Source Code
          </a>
        </p>
      </div>
    </footer>

    <noscript>
      <div class="alert alert-warning text-center m-3" role="alert">
        JavaScript is required for search functionality. The sitemap links will still work.
      </div>
    </noscript>
  </body>
</html>
